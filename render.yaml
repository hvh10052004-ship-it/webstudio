services:
  - type: web
    name: webstudio-app-khach
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /app/data/webstudio.db
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
