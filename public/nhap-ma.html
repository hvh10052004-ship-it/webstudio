<!DOCTYPE html>
<html lang="vi" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Nhập mã | WebStudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --lamp-accent: #ffab3d;
      --bg: #0c0e12;
      --card: rgba(18, 22, 28, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --input: rgba(255, 255, 255, 0.04);
      --text: #f0f3f8;
      --muted: #8b95a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 171, 61, 0.18), transparent 46%),
        var(--bg);
    }
    .card {
      width: min(440px, 100%);
      padding: 32px 28px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-size: 0.86rem; font-weight: 600; color: var(--muted); }
    input {
      width: 100%;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--input);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    #code {
      letter-spacing: 0.35em;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
    }
    input:focus { border-color: var(--lamp-accent); }
    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 700;
      color: #1a1206;
      background: linear-gradient(180deg, #ffd27a, var(--lamp-accent));
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .back {
      display: inline-block;
      margin-top: 16px;
      color: var(--lamp-accent);
      font-weight: 600;
      text-decoration: none;
    }
    .error {
      display: none;
      margin: 0 0 16px;
      color: #ff8aa0;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Nhập mã xác nhận</h1>
    <p id="hint">Nhập mã 6 số đã gửi tới Gmail của bạn.</p>
    <p class="error" id="error"></p>
    <form id="form">
      <label for="code">Mã xác nhận</label>
      <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" required />
      <button type="submit" id="submit">Xác nhận và vào trang</button>
    </form>
    <a class="back" href="/neon-lamp-login.html">Quay lại đăng ký</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const gmail = (params.get("gmail") || "").trim().toLowerCase();
    const hint = document.getElementById("hint");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");
    if (gmail) hint.textContent = "Mã 6 số đã gửi tới " + gmail + ". Nhập mã rồi bấm xác nhận.";

    function showError(message) {
      error.textContent = message;
      error.classList.add("show");
    }

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      error.classList.remove("show");
      const code = document.getElementById("code").value.trim();
      if (!/^\d{6}$/.test(code)) return showError("Nhập đủ 6 số của mã.");
      if (!gmail) return showError("Thiếu Gmail. Hãy đăng ký lại.");
      submit.disabled = true;
      try {
        const res = await fetch("/api/auth/gmail-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "verify", gmail: gmail, code: code }),
        });
        const data = await res.json();
        if (!res.ok) {
          submit.disabled = false;
          return showError(data.error || "Mã không đúng.");
        }
        try { sessionStorage.setItem("ws-auth", "1"); } catch (err) {}
        location.href = "/index.html";
      } catch (err) {
        submit.disabled = false;
        showError("Không kết nối được máy chủ.");
      }
    });
  </script>
</body>
</html>
