<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu | WebStudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --lamp-accent: #ffab3d;
      --bg: #0c0e12;
      --card: rgba(18, 22, 28, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --input: rgba(255, 255, 255, 0.04);
      --text: #f0f3f8;
      --muted: #8b95a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 171, 61, 0.18), transparent 46%),
        var(--bg);
    }
    .card {
      width: min(440px, 100%);
      padding: 32px 28px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-size: 0.86rem; font-weight: 600; color: var(--muted); }
    input {
      width: 100%;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--input);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--lamp-accent); }
    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 700;
      color: #1a1206;
      background: linear-gradient(180deg, #ffd27a, var(--lamp-accent));
      cursor: pointer;
    }
    .back {
      display: inline-block;
      margin-top: 16px;
      color: var(--lamp-accent);
      font-weight: 600;
      text-decoration: none;
    }
    .note {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 171, 61, 0.12);
      color: #ffe194;
    }
    .note.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Quên mật khẩu</h1>
    <p>Nhập email đã dùng để đăng ký. Chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.</p>
    <p class="note" id="note">Nếu email này có trong hệ thống, hướng dẫn đặt lại mật khẩu đã được gửi. Hãy kiểm tra hộp thư.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="ban@email.com" required />
      <button type="submit">Gửi hướng dẫn</button>
    </form>
    <a class="back" href="/neon-lamp-login.html">Quay lại đăng nhập</a>
  </main>
  <script>
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("note").classList.add("show");
    });
  </script>
</body>
</html>
