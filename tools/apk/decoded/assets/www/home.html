<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trang chủ — WebStudio</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body data-tab="home">
  <div class="app-phone">
    <div class="app-phone-body">
      <header class="app-home-top">
        <div>
          <h1>Tạo website của bạn</h1>
          <p>Chọn loại site — soạn trên điện thoại, xuất bản ngay</p>
        </div>
        <a class="app-avatar" href="toi.html">H</a>
      </header>

      <div class="app-section-label">Các loại website</div>
      <div class="app-type-grid" id="typeGrid">
        <button type="button" class="app-type-card" data-type="landing">
          <span class="app-type-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7 8h6M7 11h6M7 14h4"/></svg></span>
          <span class="app-type-num">01</span>
          <strong>Landing Page</strong>
          <span>1 trang, chạy ads, thu lead, bán 1 sản phẩm.</span>
        </button>
        <button type="button" class="app-type-card" data-type="company">
          <span class="app-type-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17V8l7-4 7 4v9"/><path d="M7 17v-5h6v5"/></svg></span>
          <span class="app-type-num">02</span>
          <strong>Website công ty</strong>
          <span>Giới thiệu doanh nghiệp, dịch vụ, đội ngũ, liên hệ.</span>
        </button>
        <button type="button" class="app-type-card" data-type="saas">
          <span class="app-type-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14c4-8 8-8 12 0"/><circle cx="10" cy="7" r="2"/></svg></span>
          <span class="app-type-num">03</span>
          <strong>Website Startup / SaaS</strong>
          <span>Giới thiệu sản phẩm, bảng giá, đăng ký dùng thử.</span>
        </button>
        <button type="button" class="app-type-card" data-type="ecommerce">
          <span class="app-type-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h2l1.5 9h8L18 8H7"/><circle cx="9" cy="16.5" r="1.2"/><circle cx="15" cy="16.5" r="1.2"/></svg></span>
          <span class="app-type-num">04</span>
          <strong>Web bán hàng / E-commerce</strong>
          <span>Danh mục, sản phẩm, giỏ hàng, đặt hàng COD.</span>
        </button>
      </div>

      <div class="app-section-label">Đang soạn</div>
      <article class="app-site-card">
        <div class="app-site-card-head">
          <div class="app-site-thumb">
            <img src="aura.jpg" alt="AURA Glow Essence" />
          </div>
          <div>
            <h2 id="draftName">Landing Page</h2>
            <p class="app-meta" id="draftMeta">Landing Page · soạn trên điện thoại</p>
          </div>
        </div>
        <div class="app-progress-row">
          <span>Hoàn thiện nội dung</span>
          <span>62%</span>
        </div>
        <div class="app-progress-track"><div class="app-progress-fill"></div></div>
        <div class="app-site-actions">
          <a class="app-btn app-btn-ghost" href="xem.html">Xem trang</a>
          <a class="app-btn app-btn-primary" href="soan.html">Tiếp tục soạn</a>
        </div>
      </article>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
